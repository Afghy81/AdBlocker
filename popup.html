<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DevSage Adblocker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 360px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.8;
        }

        .toggle-section {
            padding: 25px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
        }

        .toggle-label {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .toggle-label span {
            font-size: 14px;
            font-weight: 500;
        }

        .toggle-label small {
            font-size: 11px;
            opacity: 0.7;
        }

        .toggle-switch {
            position: relative;
            width: 56px;
            height: 28px;
            cursor: pointer;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            transition: 0.3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .slider {
            background-color: #4CAF50;
        }

        input:checked + .slider:before {
            transform: translateX(28px);
        }

        .stats-container {
            padding: 20px;
        }

        .main-stat {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .main-stat .number {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .main-stat .label {
            font-size: 13px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            padding: 18px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .stat-card .number {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 11px;
            opacity: 0.7;
        }

        .domains-section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .domains-section h3 {
            font-size: 13px;
            margin-bottom: 10px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .domain-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .domain-item:last-child {
            border-bottom: none;
        }

        .domain-name {
            opacity: 0.85;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 220px;
        }

        .domain-count {
            font-weight: 600;
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .actions {
            padding: 0 20px 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .btn-settings {
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
        }

        .btn-settings:hover {
            background: white;
            transform: translateY(-1px);
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        .status-indicator.off {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .no-data {
            text-align: center;
            padding: 20px;
            opacity: 0.6;
            font-size: 12px;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            opacity: 0.6;
            background: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ DevSage Adblocker</h1>
        <p>Your Privacy Guardian</p>
    </div>

    <div class="toggle-section">
        <div class="toggle-label">
            <span>
                <span class="status-indicator" id="statusDot"></span>
                <span id="statusText">Protection Active</span>
            </span>
            <small id="statusDesc">Blocking ads across the web</small>
        </div>
        <label class="toggle-switch">
            <input type="checkbox" id="toggleSwitch" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="stats-container">
        <div class="main-stat">
            <div class="number" id="todayBlocked">0</div>
            <div class="label">Ads Blocked Today</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalBlocked">0</div>
                <div class="label">Total Blocked</div>
            </div>
            <div class="stat-card">
                <div class="number" id="domainsCount">0</div>
                <div class="label">Domains Blocked</div>
            </div>
        </div>

        <div class="domains-section">
            <h3>🎯 Top Blocked Domains</h3>
            <div id="domainsList">
                <div class="no-data">No domains blocked yet</div>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-reset" id="resetBtn">Reset Stats</button>
        <button class="btn btn-settings" id="whitelistBtn">Whitelist</button>
    </div>

    <div class="footer">
        Made with ❤️ by DevSage
    </div>

    <script src="popup.js"></script>
</body>
</html>
